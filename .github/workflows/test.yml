name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        gemfile: [ '8.1.0', '8.0.0', '7.2.0', '7.1.0', '7.0.1' ]
        ruby: [ '4.0', '3.4', '3.3', '3.2', '3.1', '3.0' ]
        exclude:
          - ruby: '3.0'
            gemfile: '7.2.0'
          - ruby: '3.1'
            gemfile: '8.0.0'
          - ruby: '3.0'
            gemfile: '8.0.0'
          - ruby: '3.0'
            gemfile: '8.1.0'
          - ruby: '3.1'
            gemfile: '8.1.0'
      fail-fast: false
    runs-on: ubuntu-latest
    name: ${{ matrix.ruby }} rails-${{ matrix.gemfile }}
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    # Each database runs even if an earlier one fails, so one run reports them all.
    - name: Test with sqlite3
      run: bundle exec rake db:create db:migrate && bundle exec rake test
      env:
        DB: sqlite3
    - name: Test with postgresql
      if: ${{ !cancelled() }}
      run: bundle exec rake db:create db:migrate && bundle exec rake test
      env:
        DB: postgresql
    - name: Test with mysql
      if: ${{ !cancelled() }}
      run: bundle exec rake db:create db:migrate && bundle exec rake test
      env:
        DB: mysql

    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.gemfile }}.gemfile
      BUNDLE_JOBS: 4
      BUNDLE_PATH: vendor/bundle
      CI: true
      COVERALLS: true
      MYSQL_PASSWORD: root
      PGHOST: localhost
      PGPASSWORD: postgres
      PGPORT: 5432
      PGUSER: postgres
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:14
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 1s --health-timeout 5s --health-retries 30
        env:
          POSTGRES_PASSWORD: postgres

      mysql:
        image: mysql:8.4
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping" --health-interval 1s --health-timeout 5s --health-retries 60
        env:
          MYSQL_ROOT_PASSWORD: root
